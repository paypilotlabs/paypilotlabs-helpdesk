name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python compiles
        run: python -m compileall -q -x "node_modules" helpdesk
      - name: No imports of other PayPilotLabs products
        run: python .github/scripts/check_independence.py

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check out PayPilotLabs Framework (the frontend uses its shared UI package)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paypilotlabs/paypilotlabs-framework
          path: _framework
          # While paypilotlabs-framework is private, CI needs a read-only token saved as the
          # FRAMEWORK_READ_TOKEN secret. Once the framework is public, the default token works.
          token: ${{ secrets.FRAMEWORK_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Place the framework where a bench keeps it (../frappe)
        run: mv "$GITHUB_WORKSPACE/_framework" "$GITHUB_WORKSPACE/../frappe"
      - name: Stub bench config the build reads
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../sites"
          echo '{"socketio_port": 9000, "webserver_port": 8000}' > "$GITHUB_WORKSPACE/../../sites/common_site_config.json"
      - name: Build desk
        working-directory: desk
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive
          npx --yes yarn@1.22.22 build
