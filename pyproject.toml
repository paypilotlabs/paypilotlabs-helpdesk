[project]
name = "helpdesk"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
maintainers = [
    { name = "PayPilotLabs" }
]
description = "PayPilotLabs Helpdesk: customer service desk, based on Frappe Helpdesk"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Core dependencies
    "textblob==0.18.0.post0",
]
[build-system]
requires = ["flit_core >=3.4,<5"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
telephony = ">=0.0.1,<1.0.0"

[tool.bench.assets]
build_dir = "./desk"
out_dir = "./helpdesk/public/desk"
index_html_path = "./helpdesk/www/helpdesk/index.html"

[project.urls]
Homepage = "https://paypilotlabs.com"
Repository = "https://github.com/paypilotlabs/paypilotlabs-helpdesk.git"
"Bug Reports" = "https://paypilotlabs.com/roadmap/"
Upstream = "https://github.com/frappe/helpdesk"
